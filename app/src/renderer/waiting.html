<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meelu</title>
  <style>
    /* Meelu tokens (mirrors dashboard/src/app/globals.css) */
    :root {
      --bg: #f8f5eb; --panel: #fffdf7; --edge: #e6e1d1;
      --ink: #1f2d3d; --sub: #5b6b7f; --faint: #8fa0b3; --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { text-align: center; max-width: 380px; padding: 24px; }
    .mark { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .wordmark { font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
    .spin {
      width: 22px; height: 22px; margin: 0 auto 14px;
      border: 2.5px solid var(--edge); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: var(--sub); line-height: 1.55; }
    code {
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      background: var(--panel); border: 1px solid var(--edge);
      border-radius: 6px; padding: 1px 6px; color: var(--ink);
    }
    .hint { font-size: 12px; color: var(--faint); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2c1.2 3.2 2 4.6 4.4 5.4C19 8.2 21 8.6 22 12c-1 3.4-3 3.8-5.6 4.6C14 17.4 13.2 18.8 12 22c-1.2-3.2-2-4.6-4.4-5.4C5 15.8 3 15.4 2 12c1-3.4 3-3.8 5.6-4.6C10 6.6 10.8 5.2 12 2Z" fill="#2563eb"/>
        <circle cx="12" cy="12" r="2.6" fill="#fffdf7"/>
      </svg>
      <span class="wordmark">Meelu</span>
    </div>
    <div class="spin" aria-hidden="true"></div>
    <p>Waiting for the dashboard server…</p>
    <p class="hint">Start it with <code>npm run dev</code> in <code>dashboard/</code> — the app connects by itself.</p>
  </div>
</body>
</html>
