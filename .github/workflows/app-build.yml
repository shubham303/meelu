name: App build

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Which endpoints the app is built against
        type: choice
        options:
          - prod
          - test
        default: prod
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

env:
  DIST_SUFFIX: ${{ inputs.flavour == 'test' && ':test' || '' }}

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Write the OAuth client
        env:
          MEELU_OAUTH_CLIENT_JSON: ${{ secrets.MEELU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$MEELU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$MEELU_OAUTH_CLIENT_JSON" > oauth-client.json
          fi

      - name: Install for arm64
        run: npm ci --os=darwin --cpu=arm64

      - name: Build arm64
        run: npm run "dist:mac${DIST_SUFFIX}" -- --arm64

      - name: Install for x64
        run: npm ci --os=darwin --cpu=x64

      - name: Build x64
        run: npm run "dist:mac${DIST_SUFFIX}" -- --x64

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: app/dist/Meelu*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Write the OAuth client
        env:
          MEELU_OAUTH_CLIENT_JSON: ${{ secrets.MEELU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$MEELU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$MEELU_OAUTH_CLIENT_JSON" > oauth-client.json
          fi

      - name: Install
        run: npm ci

      - name: Build x64
        run: npm run "dist:win${DIST_SUFFIX}" -- --x64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/Meelu*.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/package.json
          sparse-checkout-cone-mode: false

      - name: Read the app version
        id: version
        run: |
          version=$(node -p 'require("./app/package.json").version')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "app-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match app/package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to downloads.meelu.tech
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ inputs.flavour == 'test' && 'test/' || '' }}
        run: |
          ls -la dist
          sha256sum dist/* > dist/SHA256SUMS.txt
          for f in dist/*; do
            case "$f" in
              *.dmg) type=application/x-apple-diskimage ;;
              *.exe) type=application/vnd.microsoft.portable-executable ;;
              *) type=text/plain ;;
            esac
            aws s3 cp "$f" "s3://meelu-downloads/${PREFIX}$(basename "$f")" --endpoint-url "$R2_ENDPOINT" --content-type "$type" --cache-control "no-cache" --only-show-errors
          done

      - name: Announce the version to installed apps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ inputs.flavour == 'test' && 'test/' || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://downloads.meelu.tech/${PREFIX}"
          installer() { basename "$(ls dist/$1)"; }
          jq -n \
            --arg version "$VERSION" \
            --arg macArm "${base}$(installer '*-mac-arm64.dmg')" \
            --arg macX64 "${base}$(installer '*-mac-x64.dmg')" \
            --arg win "${base}$(installer '*-windows-x64.exe')" \
            '{version: $version, installers: {"darwin-arm64": $macArm, "darwin-x64": $macX64, "win32-x64": $win}}' \
            > version.json
          cat version.json
          aws s3 cp version.json "s3://meelu-downloads/${PREFIX}version.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "no-cache" --only-show-errors
