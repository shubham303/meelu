name: App build

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Which endpoints the app is built against
        type: choice
        options:
          - prod
          - test
        default: prod
  push:
    branches:
      - main
      - test
    paths:
      - "app/**"
      - ".github/workflows/app-build.yml"

permissions:
  contents: read

concurrency:
  group: app-build-${{ inputs.flavour || (github.ref_name == 'test' && 'test') || 'prod' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      flavour: ${{ steps.decide.outputs.flavour }}
      prefix: ${{ steps.decide.outputs.prefix }}
      dist_suffix: ${{ steps.decide.outputs.dist_suffix }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/package.json
          sparse-checkout-cone-mode: false

      - name: Decide whether to build
        id: decide
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          FLAVOUR: ${{ inputs.flavour || (github.ref_name == 'test' && 'test') || 'prod' }}
        run: |
          if [ "$FLAVOUR" = "test" ]; then prefix="test/"; suffix=":test"; else prefix=""; suffix=""; fi
          version=$(node -p 'require("./app/package.json").version')
          if aws s3 cp "s3://meelu-downloads/${prefix}version.json" published.json --endpoint-url "$R2_ENDPOINT" --only-show-errors 2>/dev/null; then
            published=$(jq -r '.version // "0.0.0"' published.json)
          else
            published="0.0.0"
          fi
          newer=$(node -e '
            const p = (v) => v.replace(/^v/, "").split(".").map(Number);
            const [a, b] = [p(process.argv[1]), p(process.argv[2])];
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) { console.log(a[i] > b[i]); process.exit(0); }
            console.log(false);
          ' "$version" "$published")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$newer" = "true" ]; then build=true; else build=false; fi
          echo "flavour=${FLAVOUR} package=${version} published=${published} build=${build}"
          {
            echo "build=${build}"
            echo "flavour=${FLAVOUR}"
            echo "prefix=${prefix}"
            echo "dist_suffix=${suffix}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  mac:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    env:
      DIST_SUFFIX: ${{ needs.check.outputs.dist_suffix }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Write the OAuth client
        env:
          MEELU_OAUTH_CLIENT_JSON: ${{ secrets.MEELU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$MEELU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$MEELU_OAUTH_CLIENT_JSON" > oauth-client.json
          fi

      - name: Install for arm64
        run: npm ci --os=darwin --cpu=arm64

      - name: Build arm64
        run: npm run "dist:mac${DIST_SUFFIX}" -- --arm64

      - name: Install for x64
        run: npm ci --os=darwin --cpu=x64

      - name: Build x64
        run: npm run "dist:mac${DIST_SUFFIX}" -- --x64

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          retention-days: 1
          path: app/dist/Meelu*.dmg
          if-no-files-found: error

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    env:
      DIST_SUFFIX: ${{ needs.check.outputs.dist_suffix }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Write the OAuth client
        env:
          MEELU_OAUTH_CLIENT_JSON: ${{ secrets.MEELU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$MEELU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$MEELU_OAUTH_CLIENT_JSON" > oauth-client.json
          fi

      - name: Install
        run: npm ci

      - name: Build x64
        run: npm run "dist:win${DIST_SUFFIX}" -- --x64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 1
          path: app/dist/Meelu*.exe
          if-no-files-found: error

      - name: Build the Microsoft Store package
        if: needs.check.outputs.flavour == 'prod'
        run: npm run dist:store -- --x64

      - uses: actions/upload-artifact@v4
        if: needs.check.outputs.flavour == 'prod'
        with:
          name: store
          retention-days: 7
          path: app/dist/Meelu*.appx
          if-no-files-found: error

  publish:
    needs: [check, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to downloads.meelu.tech
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ needs.check.outputs.prefix }}
        run: |
          rm -f dist/*.appx
          ls -la dist
          sha256sum dist/* > dist/SHA256SUMS.txt
          for f in dist/*; do
            case "$f" in
              *.dmg) type=application/x-apple-diskimage ;;
              *.exe) type=application/vnd.microsoft.portable-executable ;;
              *) type=text/plain ;;
            esac
            aws s3 cp "$f" "s3://meelu-downloads/${PREFIX}$(basename "$f")" --endpoint-url "$R2_ENDPOINT" --content-type "$type" --cache-control "no-cache" --only-show-errors
          done

      - name: Announce the version to installed apps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ needs.check.outputs.prefix }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          base="https://downloads.meelu.tech/${PREFIX}"
          installer() { basename "$(ls dist/$1)"; }
          jq -n \
            --arg version "$VERSION" \
            --arg macArm "${base}$(installer '*-mac-arm64.dmg')" \
            --arg macX64 "${base}$(installer '*-mac-x64.dmg')" \
            --arg win "${base}$(installer '*-windows-x64.exe')" \
            '{version: $version, installers: {"darwin-arm64": $macArm, "darwin-x64": $macX64, "win32-x64": $win}}' \
            > version.json
          cat version.json
          aws s3 cp version.json "s3://meelu-downloads/${PREFIX}version.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "no-cache" --only-show-errors

      - name: Delete the installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "mac" or .name == "windows") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
