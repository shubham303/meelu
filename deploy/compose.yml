x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATAFORSEO_AUTH: ${DATAFORSEO_AUTH:-}
  APIFY_API_KEY: ${APIFY_API_KEY:-}
  CREDITS_SIGNUP_GRANT_USD: ${CREDITS_SIGNUP_GRANT_USD:-5}
  CREDITS_MINIMUM_BALANCE_USD: ${CREDITS_MINIMUM_BALANCE_USD:-0.2}
  MEELU_EMBED_DISABLED: ${MEELU_EMBED_DISABLED:-}
  MEELU_EMBED_MODEL: ${MEELU_EMBED_MODEL:-}
  MEELU_ONNX_THREADS: ${MEELU_ONNX_THREADS:-}

services:
  migrate:
    build:
      context: ../api
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  api:
    build:
      context: ../api
      target: api
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_ORIGINS: ${APP_ORIGINS}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_SECRET: ${DODO_PAYMENTS_WEBHOOK_SECRET:-}
      DODO_PAYMENTS_BASE_URL: ${DODO_PAYMENTS_BASE_URL}
      DODO_PAYMENTS_CREDITS_PRODUCT_ID: ${DODO_PAYMENTS_CREDITS_PRODUCT_ID:-}
      DODO_PAYMENTS_RETURN_URL: ${DODO_PAYMENTS_RETURN_URL}
      CREDITS_SITE_DAILY_USD: ${CREDITS_SITE_DAILY_USD:-0.4}
      CREDITS_BILLING_PERIOD_HOURS: ${CREDITS_BILLING_PERIOD_HOURS:-24}
      CREDITS_BILLING_SWEEP_SECONDS: ${CREDITS_BILLING_SWEEP_SECONDS:-900}
      MEELU_RERANK_DISABLED: ${MEELU_RERANK_DISABLED:-}
      MEELU_RERANK_MODEL: ${MEELU_RERANK_MODEL:-}
      MEELU_SEARCH_MIN_SIMILARITY: ${MEELU_SEARCH_MIN_SIMILARITY:-}
    volumes:
      - embed-models:/app/.cache/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  agent:
    build:
      context: ../api
      target: agent
    restart: unless-stopped
    environment:
      <<: *backend-env
      AGENT_DATA_DIR: /app/agent-data
      AGENT_ALLOWED_HOSTS: ${AGENT_ALLOWED_HOSTS}
    volumes:
      - agentdata:/app/agent-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  embed-worker:
    build:
      context: ../api
      target: embed-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      MEELU_EMBED_INTERVAL_MS: ${MEELU_EMBED_INTERVAL_MS:-}
    volumes:
      - embed-models:/app/.cache/models
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ../dashboard
      args:
        MEELU_API_URL: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MEELU_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  auth:
    image: supabase/auth:v2.197.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${AUTH_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${AUTH_SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_SITE_URL}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      DATABASE_URL: ${AUTH_DATABASE_URL}
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: 465
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: ${RESEND_API_KEY}
      GOTRUE_SMTP_ADMIN_EMAIL: ${AUTH_SMTP_SENDER:-noreply@meelu.tech}
      GOTRUE_SMTP_SENDER_NAME: Meelu
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 10
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 60
      GOTRUE_RATE_LIMIT_VERIFY: 30
      GOTRUE_RATE_LIMIT_HEADER: CF-Connecting-IP
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  agentdata:
  embed-models:
